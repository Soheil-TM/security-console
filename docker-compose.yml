# One host, one command: docker compose up -d --build
# Generate the secret files before the first start and do not commit them.
# The console process does not receive the Docker socket. The scanner service
# is the only container that does, and it accepts only approved scan jobs.
# SonarQube and its database start on this same machine.

networks:
  default:
    name: security-console

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: console
      POSTGRES_DB: security_console_db
      POSTGRES_PASSWORD_FILE: /run/secrets/console_db_password
    secrets:
      - console_db_password
    volumes:
      - console_pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U console -d security_console_db"]
      interval: 5s
      timeout: 3s
      retries: 12

  sonar-db:
    image: postgres:17
    environment:
      POSTGRES_USER: sonar
      POSTGRES_DB: sonar
      POSTGRES_PASSWORD_FILE: /run/secrets/sonar_db_password
    secrets:
      - sonar_db_password
    volumes:
      - sonar_pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Elasticsearch refuses to start below this host limit. The value is not
  # namespaced, so a new machine and a reboot both need it set on the host.
  # A higher existing value is left alone.
  host-setup:
    image: busybox:1.36.1
    privileged: true
    restart: unless-stopped
    volumes:
      - /etc/sysctl.d:/host-sysctl.d
    command:
      - sh
      - -c
      - |
        set -eu
        floor=262144
        apply() {
          current=$(sysctl -n vm.max_map_count 2>/dev/null || echo 0)
          if [ "$$current" -lt "$$floor" ]; then
            sysctl -w vm.max_map_count=$$floor
          fi
        }
        persist() {
          file=/host-sysctl.d/99-security-console.conf
          if [ ! -d /host-sysctl.d ] || [ -f "$$file" ]; then
            return 0
          fi
          current=$(sysctl -n vm.max_map_count 2>/dev/null || echo 0)
          if [ "$$current" -ge "$$floor" ]; then
            return 0
          fi
          printf '%s\n' "vm.max_map_count=$$floor" > "$$file"
        }
        apply
        persist
        while true; do
          apply
          sleep 60
        done
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test $(sysctl -n vm.max_map_count) -ge 262144",
        ]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    depends_on:
      sonar-db:
        condition: service_healthy
      host-setup:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_WEB_CONTEXT: /sonar
      # This node is the only Elasticsearch node, so a full disk cannot be
      # solved by moving shards. Keep a hard stop before the disk fills.
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Dcluster.routing.allocation.disk.watermark.low=93% -Dcluster.routing.allocation.disk.watermark.high=96% -Dcluster.routing.allocation.disk.watermark.flood_stage=98%"
    env_file:
      - ./secrets/sonar-db.env
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9000/sonar/api/system/status | grep -q '\"status\":\"UP\"'",
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  # Writes the scanner token after SonarQube is up. Scanner and console do
  # not wait for it, so a Sonar password problem cannot block the other tools.
  sonar-init:
    build: .
    image: security-console:17
    entrypoint: ["python", "-m", "security_console.sonar_setup"]
    user: "0:0"
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_URL: http://sonarqube:9000/sonar
      SONAR_PROJECT_KEY: ${SONAR_PROJECT_KEY:-security-console}
      SONAR_ADMIN_PASSWORD_FILE: /run/sonar/admin_password
      SONAR_TOKEN_FILE: /run/sonar/token
      SONAR_INIT_STATUS_FILE: /run/sonar/status
      SONAR_DB_HOST: sonar-db
      SONAR_DB_PASSWORD_FILE: /run/sonar/db_password
      SONAR_SETUP_UID: "10001"
      SONAR_SETUP_GID: "10001"
    volumes:
      - ./secrets/sonar_admin_password.txt:/run/sonar/admin_password
      - ./secrets/sonar_token.txt:/run/sonar/token
      - ./secrets/sonar_init_status.json:/run/sonar/status
      - ./secrets/sonar_db_password.txt:/run/sonar/db_password:ro
    security_opt:
      - no-new-privileges:true
    restart: on-failure

  scanner:
    build: .
    image: security-console:17
    entrypoint: ["python", "-m", "security_console.worker"]
    environment:
      SCANNER_TOKEN_FILE: /run/secrets/scanner_token
      SONAR_TOKEN_FILE: /run/sonar/token
      SONAR_URL: http://sonarqube:9000/sonar
      SONAR_PROJECT_KEY: ${SONAR_PROJECT_KEY:-security-console}
      SCANNER_NETWORK: security-console
      HOST_SCAN_DIR: /var/lib/security-scans
      SCAN_DIR: /scans
    secrets:
      - scanner_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/security-scans:/scans
      - ./secrets/sonar_token.txt:/run/sonar/token:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 12

  console:
    build: .
    image: security-console:17
    depends_on:
      db:
        condition: service_healthy
      scanner:
        condition: service_healthy
    environment:
      CONSOLE_DB_HOST: db
      CONSOLE_ADMIN_USERNAME: admin
      CONSOLE_ENV: development
      CONSOLE_JWT_KEY_FILE: /run/secrets/console_jwt_key
      CONSOLE_DB_PASSWORD_FILE: /run/secrets/console_db_password
      FALCO_INGEST_TOKEN_FILE: /run/secrets/falco_ingest_token
      SCANNER_URL: http://scanner:8092
      SCANNER_TOKEN_FILE: /run/secrets/scanner_token
      COOKIE_SECURE: "0"
      DATA_DIR: /data
      SONAR_PUBLIC_URL: ${SONAR_PUBLIC_URL:-}
      SONAR_PROJECT_KEY: ${SONAR_PROJECT_KEY:-security-console}
      SONAR_URL: http://sonarqube:9000/sonar
      SONAR_ADMIN_PASSWORD_FILE: /run/sonar/admin_password
      SONAR_TOKEN_FILE: /run/sonar/token
      SONAR_INIT_STATUS_FILE: /run/sonar/status
      SONAR_DB_HOST: sonar-db
      SONAR_DB_PASSWORD_FILE: /run/sonar/db_password
    secrets:
      - console_jwt_key
      - console_db_password
      - falco_ingest_token
      - scanner_token
    volumes:
      - console_data:/data
      - ./secrets/sonar_admin_password.txt:/run/sonar/admin_password
      - ./secrets/sonar_token.txt:/run/sonar/token
      - ./secrets/sonar_init_status.json:/run/sonar/status
      - ./secrets/sonar_db_password.txt:/run/sonar/db_password:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  console_jwt_key:
    file: ./secrets/console_jwt_key.txt
  console_db_password:
    file: ./secrets/console_db_password.txt
  falco_ingest_token:
    file: ./secrets/falco_ingest_token.txt
  scanner_token:
    file: ./secrets/scanner_token.txt
  sonar_db_password:
    file: ./secrets/sonar_db_password.txt

volumes:
  console_pg:
  console_data:
  sonar_pg:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
