[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["app.py", "security_console", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
