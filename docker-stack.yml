# Web console for Semgrep, Checkov, and Falco alerts.
# Pinned to work-01: the scan history volume is local to that node,
# and SonarQube already uses the RAM on work-03.
# Docker starts at boot, so Swarm brings this service back with the others.
# The image already contains git and the Python libraries, so a reboot
# does not download packages before the page opens.
# Build and load it on work-01, then deploy with --resolve-image never.
# Login state is a database named security_console_db on the existing
# SonarQube Postgres. COOKIE_SECURE stays off while the console is plain HTTP.

services:
  console:
    image: security-console:17
    entrypoint: ["python", "/app/app.py"]
    environment:
      HOST_SCAN_DIR: /var/lib/security-scans
      SCAN_DIR: /scans
      DATA_DIR: /data
      SONAR_URL: http://192.168.205.155:9000
      SONAR_PROJECT_KEY: alireza
      SONAR_TOKEN_FILE: /run/secrets/sonar_token
      CONSOLE_ADMIN_USERNAME: admin
      CONSOLE_JWT_KEY_FILE: /run/secrets/console_jwt_key
      CONSOLE_ADMIN_PASSWORD_FILE: /run/secrets/console_admin_password
      CONSOLE_DB_PASSWORD_FILE: /run/secrets/console_db_password
      CONSOLE_DB_BOOTSTRAP_PASSWORD_FILE: /run/secrets/sonar_db_password
      CONSOLE_DB_HOST: sonarqube_db
      FALCO_INGEST_TOKEN_FILE: /run/secrets/falco_ingest_token
      COOKIE_SECURE: "0"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /var/lib/security-scans
        target: /scans
      - console_data:/data
    secrets:
      - source: sonar_token
        target: sonar_token
      - source: console_jwt_key
        target: console_jwt_key
      - source: console_admin_password
        target: console_admin_password
      - source: console_db_password
        target: console_db_password
      - source: sonar_db_password
        target: sonar_db_password
      - source: falco_ingest_token
        target: falco_ingest_token
    ports:
      - target: 8080
        published: 8091
        protocol: tcp
        mode: ingress
    networks:
      security:
        aliases:
          - security-console
      sonar_db:
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
          - node.hostname == work-01
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  security:
    name: security
    driver: overlay
  sonar_db:
    external: true
    name: sonarqube_sonar

volumes:
  console_data:

secrets:
  sonar_token:
    file: ./secrets/sonar_token.txt
  console_jwt_key:
    file: ./secrets/console_jwt_key.txt
  console_admin_password:
    file: ./secrets/console_admin_password.txt
  console_db_password:
    file: ./secrets/console_db_password.txt
  sonar_db_password:
    external: true
    name: sonarqube_db_password
  falco_ingest_token:
    external: true
    name: console_falco_ingest_token
