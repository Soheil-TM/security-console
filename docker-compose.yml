# Single-host Docker. The same image is used by Swarm and Kubernetes.
# Generate the secret files before `docker compose up` and do not commit them.
# The console process does not receive the Docker socket. The scanner service
# is the only container that does, and it accepts only approved scan jobs.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: console
      POSTGRES_DB: security_console_db
      POSTGRES_PASSWORD_FILE: /run/secrets/console_db_password
    secrets:
      - console_db_password
    volumes:
      - console_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U console -d security_console_db"]
      interval: 5s
      timeout: 3s
      retries: 12

  scanner:
    build: .
    image: security-console:17
    entrypoint: ["python", "-m", "security_console.worker"]
    environment:
      SCANNER_TOKEN_FILE: /run/secrets/scanner_token
      SONAR_URL: ${SONAR_URL:-http://192.168.205.155:9000}
      SONAR_PROJECT_KEY: ${SONAR_PROJECT_KEY:-alireza}
      HOST_SCAN_DIR: /var/lib/security-scans
      SCAN_DIR: /scans
    secrets:
      - scanner_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/security-scans:/scans
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 12

  console:
    build: .
    image: security-console:17
    depends_on:
      db:
        condition: service_healthy
      scanner:
        condition: service_healthy
    environment:
      CONSOLE_DB_HOST: db
      CONSOLE_ADMIN_USERNAME: admin
      CONSOLE_ENV: development
      CONSOLE_JWT_KEY_FILE: /run/secrets/console_jwt_key
      CONSOLE_DB_PASSWORD_FILE: /run/secrets/console_db_password
      FALCO_INGEST_TOKEN_FILE: /run/secrets/falco_ingest_token
      SCANNER_URL: http://scanner:8092
      SCANNER_TOKEN_FILE: /run/secrets/scanner_token
      COOKIE_SECURE: "0"
      DATA_DIR: /data
      SONAR_URL: ${SONAR_URL:-http://192.168.205.155:9000}
      SONAR_PROJECT_KEY: ${SONAR_PROJECT_KEY:-alireza}
    secrets:
      - console_jwt_key
      - console_db_password
      - falco_ingest_token
      - scanner_token
    volumes:
      - console_data:/data
    security_opt:
      - no-new-privileges:true

secrets:
  console_jwt_key:
    file: ./secrets/console_jwt_key.txt
  console_db_password:
    file: ./secrets/console_db_password.txt
  falco_ingest_token:
    file: ./secrets/falco_ingest_token.txt
  scanner_token:
    file: ./secrets/scanner_token.txt

volumes:
  console_pg:
  console_data:
